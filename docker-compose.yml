services:
  wdtt-socks-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wdtt-socks-server
    restart: unless-stopped
    # NET_ADMIN is critical for creating TUN interfaces (wdtt0) and managing redirect rules inside the container
    cap_add:
      - NET_ADMIN
    # Enables forwarding of IP packets at the container level
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "56000:56000/udp"
    environment:
      - CLIENT_PASSWORD=change-me-please
      - SOCKS_SERVER=127.0.0.1:1080
      - SOCKS_USER=
      - SOCKS_PASS=
    # Pass environment variables as command args to server_socks.go
    command: >
      -listen 0.0.0.0:56000
      -password ${CLIENT_PASSWORD}
      -socks-server ${SOCKS_SERVER}
      -socks-user ${SOCKS_USER:-}
      -socks-pass ${SOCKS_PASS:-}
